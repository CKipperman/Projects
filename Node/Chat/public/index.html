<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/chat.css">
</head>

<body>
  <div id="login">
    <h2>Welcome to the chat</h2>
    <h4>Please enter your name to continue.</h4>
    <form id="loginForm">
      <input name="username" id="usernameInput" required>
      <button>Join Chat</button>
    </form>
  </div>
  <div id="chat">
    <h3 id="welcome"></h3>
    <div id="messages"></div>
    <form id="messageForm">
      <input name="message" id="messageInput" required>
      <button>send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>

</html>
