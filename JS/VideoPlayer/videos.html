<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Videos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9fb;
        }

        header {
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            padding: 1.5em;
        }

        h1 {
            font-size: 2em;
        }

        #vidBox {
            height: 60vh;
            width: 75%;
            margin: 2em auto;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 1.5em;
        }

        #vidPlayer,
        .sidebar {
            height: 100%;
            width: 100%;
            border-radius: .9em;
        }

        #vidPlayer {
            display: block;
            object-fit: contain;
            object-position: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, .2);
        }

        .sidebar {
            background-color: white;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .1);
            overflow: hidden auto;
        }

        #vidList {
            list-style: none;
            padding: 10px;
        }

        #vidList li {
            display: flex;
            padding: .75em;
            margin: 1em;
            background-color: #f9f9fb;
            border-radius: .9em;
            gap: 1em;
            cursor: pointer;
        }

        .sidebar #vidList li:hover {
            background-color: rgba(57, 146, 206, 0.171);
        }

        #vidList li div {
            width: 100%;
            height: 4em;
            font-weight: 500;
            align-content: center;
        }
        img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: .45rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>My Videos:</h1>
    </header>
    <div id="vidBox">
        <video id="vidPlayer" controls></video>
        <div class="sidebar">
            <ul id="vidList"></ul>
        </div>
    </div>
    <script src="videos.js"></script>
</body>

</html>
